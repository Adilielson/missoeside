name: Publicar Supabase após alterações no GitHub
on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "O que publicar?"
        required: true
        type: choice
        default: functions
        options:
          - functions
          - migrations

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar configuração
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN ausente"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "::error::SUPABASE_PROJECT_REF ausente"; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Publicar Edge Functions (sem migrações)
        if: github.event_name == 'push' || inputs.deploy_target == 'functions'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
      - name: Aplicar migrações (somente execução manual explícita)
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'migrations'
        run: |
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::SUPABASE_DB_PASSWORD ausente"; exit 1; }
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --remote --yes
