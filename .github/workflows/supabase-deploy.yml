name: Publicar Supabase após alterações no GitHub
on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar configuração
        id: config
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Configure SUPABASE_ACCESS_TOKEN (secret) e SUPABASE_PROJECT_REF (variable) no repositório para publicar Edge Functions."
          fi
      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.ready == 'true'
        with:
          version: latest
      - name: Aplicar migrações
        if: steps.config.outputs.ready == 'true' && env.SUPABASE_DB_PASSWORD != ''
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --yes
      - name: Bloquear deploy sem migrações
        id: migration
        if: steps.config.outputs.ready == 'true'
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_DB_PASSWORD ausente: Edge Functions não serão publicadas para evitar incompatibilidade com migrações."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publicar Edge Functions
        if: steps.migration.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
