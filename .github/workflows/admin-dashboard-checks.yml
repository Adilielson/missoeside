name: Admin dashboard checks
on:
  pull_request:
    paths:
      - "src/**"
      - "supabase/functions/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts --legacy-peer-deps --package-lock=false --no-audit --no-fund
      - name: Assert donation routes and project link consistency
        run: node scripts/check-donation-flow.mjs
      - name: Build (and generate route types)
        run: npm run build
      - name: Typecheck (known baseline errors are reported)
        continue-on-error: true
        run: npx tsc --noEmit
