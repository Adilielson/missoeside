name: Admin dashboard checks
on:
  pull_request:
    paths:
      - "src/**"
      - "supabase/functions/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
